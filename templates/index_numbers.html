<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Lineup Generator - Manual Entry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #e0e1dd;
        }
        
        .container {
            max-width: 1100px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            font-size: 2.8em;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
        }
        
        .subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 40px;
            color: #778da9;
            font-weight: 400;
        }
        
        .method-toggle {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }
        
        .method-btn {
            padding: 12px 24px;
            font-size: 0.9em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .method-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .method-btn.active {
            background: #415a77;
            border-color: #778da9;
        }
        
        .upload-section {
            background: rgba(13, 27, 42, 0.8);
            border-radius: 8px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .input-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 20px;
        }
        
        .input-label {
            font-size: 0.9em;
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #778da9;
        }
        
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: white;
            resize: vertical;
        }
        
        .upload-box {
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .upload-box:hover {
            border-color: #778da9;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .upload-box.has-file {
            border-color: #52b788;
            background: rgba(82, 183, 136, 0.05);
        }
        
        .upload-box.dragover {
            border-color: #3a86ff;
            background: rgba(58, 134, 255, 0.1);
        }
        
        .file-name {
            margin-top: 10px;
            color: #52b788;
            font-weight: bold;
            font-size: 0.85em;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .generate-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.1em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: #415a77;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .generate-btn:hover:not(:disabled) {
            background: #778da9;
        }
        
        .generate-btn:disabled {
            background: #1b263b;
            color: #415a77;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #778da9;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid #e63946;
            color: #f1faee;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            display: none;
            font-size: 0.9em;
        }
        
        .instructions {
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 30px;
            margin-top: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .instructions h3 {
            margin-bottom: 20px;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
        }
        
        .instructions li {
            margin: 12px 0;
            line-height: 1.6;
            font-size: 0.95em;
            color: #778da9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NHL Lineup Generator</h1>
        <p class="subtitle">Manual number entry for precision lineup building</p>
        
        <div class="method-toggle">
            <button class="method-btn" onclick="window.location.href='/'">Screenshot Method</button>
            <button class="method-btn active">Number Entry Method</button>
        </div>
        
        <div class="upload-section">
            <div class="config-section" style="margin-bottom: 30px;">
                <div style="max-width: 400px; margin: 0 auto;">
                    <label style="display: block; margin-bottom: 10px; font-weight: 700; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: #778da9;">Select Team</label>
                    <select id="team-select" style="width: 100%; padding: 12px; font-size: 1em; border-radius: 4px; background: #0d1b2a; color: white; border: 1px solid rgba(255,255,255,0.2);">
                        <option value="">Choose Team...</option>
                        <option value="ANA">Anaheim Ducks</option>
                        <option value="BOS">Boston Bruins</option>
                        <option value="BUF">Buffalo Sabres</option>
                        <option value="CAR">Carolina Hurricanes</option>
                        <option value="CBJ">Columbus Blue Jackets</option>
                        <option value="CGY">Calgary Flames</option>
                        <option value="CHI">Chicago Blackhawks</option>
                        <option value="COL">Colorado Avalanche</option>
                        <option value="DAL">Dallas Stars</option>
                        <option value="DET">Detroit Red Wings</option>
                        <option value="EDM">Edmonton Oilers</option>
                        <option value="FLA">Florida Panthers</option>
                        <option value="LAK">Los Angeles Kings</option>
                        <option value="MIN">Minnesota Wild</option>
                        <option value="MTL">Montreal Canadiens</option>
                        <option value="NJD">New Jersey Devils</option>
                        <option value="NSH">Nashville Predators</option>
                        <option value="NYI">New York Islanders</option>
                        <option value="NYR">New York Rangers</option>
                        <option value="OTT">Ottawa Senators</option>
                        <option value="PHI">Philadelphia Flyers</option>
                        <option value="PIT">Pittsburgh Penguins</option>
                        <option value="SEA">Seattle Kraken</option>
                        <option value="SJS">San Jose Sharks</option>
                        <option value="STL">St. Louis Blues</option>
                        <option value="TBL">Tampa Bay Lightning</option>
                        <option value="TOR">Toronto Maple Leafs</option>
                        <option value="UTA">Utah Hockey Club</option>
                        <option value="VAN">Vancouver Canucks</option>
                        <option value="VGK">Vegas Golden Knights</option>
                        <option value="WPG">Winnipeg Jets</option>
                        <option value="WSH">Washington Capitals</option>
                    </select>
                </div>
            </div>
            
            <div class="input-grid">
                <div class="input-box">
                    <label class="input-label">Line Combinations (Numbers)</label>
                    <textarea id="lines-input" placeholder="Format: 46-22-11"></textarea>
                    
                    <div class="upload-box" id="lines-screenshot-box" onclick="document.getElementById('lines-screenshot-input').click()" style="margin-top: 20px; min-height: 100px;">
                        <div style="font-size: 0.85em; font-weight: 700;">OR UPLOAD COMBINATIONS IMAGE</div>
                        <div class="file-name" id="lines-screenshot-name"></div>
                    </div>
                    <input type="file" id="lines-screenshot-input" accept="image/*" onchange="handleLinesScreenshot(this)">
                </div>
                
                <div class="input-box">
                    <label class="input-label">Team Roster Reference</label>
                    <div class="upload-box" id="roster-box" onclick="document.getElementById('roster-input').click()">
                        <div style="font-size: 0.9em; font-weight: 700; margin-bottom: 8px;">UPLOAD ROSTER SCREENSHOT</div>
                        <div style="font-size: 0.8em; opacity: 0.6;">(Stats table with # and Name)</div>
                        <div class="file-name" id="roster-name"></div>
                    </div>
                    <input type="file" id="roster-input" accept="image/*" onchange="handleRosterUpload(this)">
                </div>
            </div>
            
            <button class="generate-btn" id="generate-btn" onclick="generateLineup()" disabled>
                Generate Lineup
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Matching numbers to roster data...</p>
        </div>
        
        <div class="error" id="error"></div>
    </div>
    
    <script>
        let linesText = '';
        let linesScreenshot = null;
        let rosterScreenshot = null;
        
        function setupDragAndDrop(boxId, callback) {
            const box = document.getElementById(boxId);
            box.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); box.classList.add('dragover'); });
            box.addEventListener('dragleave', (e) => { e.preventDefault(); e.stopPropagation(); box.classList.remove('dragover'); });
            box.addEventListener('drop', (e) => {
                e.preventDefault(); e.stopPropagation(); box.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0 && files[0].type.startsWith('image/')) { callback(files[0]); }
            });
        }
        
        setupDragAndDrop('roster-box', (file) => {
            const input = document.getElementById('roster-input');
            const dataTransfer = new DataTransfer(); dataTransfer.items.add(file); input.files = dataTransfer.files;
            handleRosterUpload(input);
        });
        
        setupDragAndDrop('lines-screenshot-box', (file) => {
            const input = document.getElementById('lines-screenshot-input');
            const dataTransfer = new DataTransfer(); dataTransfer.items.add(file); input.files = dataTransfer.files;
            handleLinesScreenshot(input);
        });
        
        document.getElementById('lines-input').addEventListener('input', (e) => { linesText = e.target.value.trim(); checkReadyToGenerate(); });
        
        function handleLinesScreenshot(input) {
            const file = input.files[0]; if (!file) return;
            linesScreenshot = file;
            document.getElementById('lines-screenshot-name').textContent = file.name;
            document.getElementById('lines-screenshot-box').classList.add('has-file');
            checkReadyToGenerate();
        }
        
        function handleRosterUpload(input) {
            const file = input.files[0]; if (!file) return;
            rosterScreenshot = file;
            document.getElementById('roster-name').textContent = file.name;
            document.getElementById('roster-box').classList.add('has-file');
            checkReadyToGenerate();
        }
        
        function checkReadyToGenerate() {
            const hasLines = linesText.length > 5 || linesScreenshot;
            const hasRoster = rosterScreenshot;
            const hasTeam = document.getElementById('team-select').value !== '';
            document.getElementById('generate-btn').disabled = !(hasLines && hasRoster && hasTeam);
        }
        
        document.getElementById('team-select').addEventListener('change', checkReadyToGenerate);
        
        async function generateLineup() {
            const formData = new FormData();
            formData.append('team', document.getElementById('team-select').value);
            if (linesScreenshot) { formData.append('lines_screenshot', linesScreenshot); } 
            else if (linesText) { formData.append('lines_text', linesText); }
            formData.append('roster_screenshot', rosterScreenshot);
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('generate-btn').disabled = true;
            
            try {
                const response = await fetch('/process_numbers', { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Processing failed');
                localStorage.removeItem('nhl_lineup_staff');
                localStorage.setItem('lineup_data', JSON.stringify(data));
                window.open('/lineup', '_blank');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generate-btn').disabled = false;
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error: ' + error.message;
                document.getElementById('generate-btn').disabled = false;
            }
        }
    </script>
</body>
</html>
