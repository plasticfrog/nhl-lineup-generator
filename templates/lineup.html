<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NHL Team Lineup</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @page {
            margin: 0;
            size: letter portrait;
        }
        
        html, body {
            min-height: 100vh;
            width: 100vw;
            background: #222; 
            display: flex;
            justify-content: center;
            overflow-y: auto;
        }
        
        .container {
            background: white;
            width: 8.5in;
            height: 11in;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            margin: 20px 0;
        }
        
        .forwards-section {
            height: 55%;
            width: 100%;
        }
        
        .defensemen-section {
            height: 45%;
            display: flex;
            border-top: 5px solid black;
        }
        
        .forwards-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(2, 1fr);
            height: 100%;
        }
        
        .forwards-grid .player:nth-child(3),
        .forwards-grid .player:nth-child(9) {
            border-right: 5px solid black;
        }
        
        .defensemen-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 45%;
            height: 100%;
        }
        
        .staff-grid {
            display: flex;
            flex-direction: column;
            width: 55%;
            height: 100%;
            border-left: 3px solid black;
        }
        
        .goalie-row {
            display: flex;
            height: 50%;
            width: 100%;
        }
        
        .goalie-row .staff-member {
            width: 30%;
        }
        
        .notes-area {
            flex: 1;
            height: 100%;
            border-left: 3px solid black;
        }
        
        .notes-area textarea {
            width: 100%;
            height: 100%;
            border: none;
            padding: 10px;
            font-size: 1.1em;
            font-weight: 900;
            resize: none;
            outline: none;
            text-transform: uppercase;
        }
        
        .coach-row {
            display: flex;
            height: 50%;
            border-top: 3px solid black;
        }
        
        .coach-row .staff-member {
            flex: 1;
        }
        
        .player {
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 0.5px solid #eee;
        }
        
        .player-img-container {
            flex: 1;
            overflow: hidden;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: move;
        }
        
        .player-info {
            background: #000 !important;
            color: #fff !important;
            text-align: center;
            padding: 4px 1px;
            font-size: 1.05em;
            font-weight: 900;
            text-transform: uppercase;
            height: 38px; /* Forced height to ensure visibility */
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .font-small { font-size: 0.85em !important; }
        .font-tiny { font-size: 0.75em !important; }
        
        .badge {
            position: absolute;
            top: 5px; left: 5px;
            color: white; font-weight: bold; font-size: 1.8em;
            padding: 4px 10px; border-radius: 6px; z-index: 20;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            border: 2px solid white;
        }
        
        .badge[data-type="star"] { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
        .badge[data-type="captain"] { background: #000; }
        .badge[data-type="alternate"] { background: #333; }
        
        .badge-selector {
            position: absolute;
            top: 5px; right: 5px;
            z-index: 30; opacity: 0;
        }
        .player-img-container:hover .badge-selector { opacity: 1; }
        
        .player-img {
            width: 100%; height: 110%;
            object-fit: cover; transform: translateY(-5%);
        }
        
        .defensemen-grid .player-img { transform: translateY(0%); object-position: center 30%; }
        .placeholder { font-size: 3em; color: #ccc; font-weight: bold; }
        
        .staff-member {
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid black;
        }
        .staff-member.hidden-coach { display: none !important; }
        
        .staff-img-container {
            flex: 1;
            position: relative;
            background: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .staff-name-input {
            background: #000 !important;
            color: #fff !important;
            text-align: center;
            padding: 6px 2px;
            font-size: 0.9em;
            font-weight: 900;
            border: none;
            width: 100%;
            text-transform: uppercase;
            height: 38px;
        }
        
        .staff-role {
            position: absolute;
            top: 5px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85) !important;
            color: white !important;
            padding: 2px 10px;
            font-size: 0.75em;
            font-weight: 900;
            border-radius: 3px;
            z-index: 15;
        }
        
        .controls {
            position: fixed;
            top: 10px; right: 10px;
            background: white; padding: 10px;
            border: 2px solid #333; border-radius: 6px;
            z-index: 1000; cursor: move;
            display: flex; flex-direction: column; gap: 5px;
        }
        
        .controls button {
            padding: 8px 12px; font-size: 13px; font-weight: bold;
            cursor: pointer; border: 1px solid #333;
        }

        @media print {
            body { background: white; }
            .container { box-shadow: none; margin: 0; width: 8.5in; height: 11in; }
            .controls, .badge-selector { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="controls" id="draggable-controls">
        <button onclick="window.print()">Print</button>
        <button onclick="downloadPDF()">Download PDF</button>
        <button onclick="toggleFourthCoach()">Add/Remove 4th Coach</button>
        <button onclick="clearAllData()">Reset to Original</button>
    </div>

    <div class="container" id="lineup-content">
        <div class="forwards-section">
            <div class="forwards-grid" id="forwards-grid"></div>
        </div>
        
        <div class="defensemen-section">
            <div class="defensemen-grid" id="defensemen-grid"></div>
            <div class="staff-grid">
                <div class="goalie-row" id="goalie-row"></div>
                <div class="coach-row" id="coach-row"></div>
            </div>
        </div>
    </div>

    <script>
        const lineupData = JSON.parse(localStorage.getItem('lineup_data') || '{}');
        const STORAGE_KEY = 'nhl_lineup_custom_images_nogap';
        const BADGE_STORAGE_KEY = 'nhl_lineup_badges';
        const COACH_TOGGLE_KEY = 'nhl_show_fourth_coach';
        const STAFF_STORAGE_KEY = 'nhl_lineup_staff';
        const CUSTOM_NAMES_KEY = 'nhl_lineup_custom_names';
        const NOTES_KEY = 'nhl_lineup_notes';
        const LAST_TEAM_KEY = 'nhl_last_team_id';

        const currentTeam = lineupData.team || 'Unknown';
        if (localStorage.getItem(LAST_TEAM_KEY) !== currentTeam) {
            localStorage.clear();
            localStorage.setItem(LAST_TEAM_KEY, currentTeam);
            localStorage.setItem('lineup_data', JSON.stringify(lineupData));
        }

        const FORWARDS = lineupData.forwards || [];
        const DEFENSEMEN = lineupData.defensemen || [];
        const GOALIES = lineupData.goalies || [];
        const COACHES = lineupData.coaches || [];

        let draggedElement = null;

        function clearAllData() {
            if(confirm('Reset to original?')) {
                const dataBackup = localStorage.getItem('lineup_data');
                localStorage.clear();
                localStorage.setItem('lineup_data', dataBackup);
                location.reload();
            }
        }

        function toggleFourthCoach() {
            const current = localStorage.getItem(COACH_TOGGLE_KEY) === 'true';
            localStorage.setItem(COACH_TOGGLE_KEY, !current);
            location.reload();
        }

        function downloadPDF() {
            const element = document.getElementById('lineup-content');
            const controls = document.getElementById('draggable-controls');
            controls.style.display = 'none';
            html2pdf().set({
                margin: 0,
                filename: `${currentTeam}_Headshots.pdf`,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            }).from(element).save().then(() => controls.style.display = 'flex');
        }

        function handleImageUpload(file, playerName, isStaff = false, staffKey = null) {
            if(!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                if (isStaff) {
                    const staffData = JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY) || '{}');
                    staffData[staffKey] = staffData[staffKey] || {};
                    staffData[staffKey].image = ev.target.result;
                    localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(staffData));
                } else {
                    const imgs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    imgs[playerName] = ev.target.result;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(imgs));
                }
                location.reload();
            };
            reader.readAsDataURL(file);
        }

        function renderPlayerName(el, player) {
            const customNames = JSON.parse(localStorage.getItem(CUSTOM_NAMES_KEY) || '{}');
            if (customNames[player.name]) {
                el.textContent = customNames[player.name];
                return;
            }
            
            const num = player.number || '';
            const lastName = player.name.split(' ').pop();

            const trySize = (hash, cls) => {
                el.className = 'player-info ' + cls;
                el.textContent = num ? (hash ? `#${num} ${lastName}` : `${num} ${lastName}`) : lastName;
                return el.scrollWidth <= (el.clientWidth + 2);
            };

            if (trySize(true, '')) return;
            if (trySize(false, '')) return;
            if (trySize(false, 'font-small')) return;
            trySize(false, 'font-tiny');
        }

        function createPlayerCard(player) {
            const card = document.createElement('div');
            card.className = 'player';
            card.draggable = true;
            
            const imgContainer = document.createElement('div');
            imgContainer.className = 'player-img-container';
            
            const customImages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const imgUrl = customImages[player.name] || player.headshot_url;
            
            if (imgUrl) {
                const img = document.createElement('img');
                img.src = imgUrl; img.className = 'player-img';
                imgContainer.appendChild(img);
            } else {
                imgContainer.innerHTML = '<div class="placeholder">?</div>';
            }

            const badges = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
            const b = badges[player.name];
            if (b && b !== 'none') {
                const bDiv = document.createElement('div');
                bDiv.className = 'badge'; bDiv.textContent = b;
                if (b === '★') bDiv.dataset.type = 'star';
                else if (b === 'C') bDiv.dataset.type = 'captain';
                else if (b === 'A') bDiv.dataset.type = 'alternate';
                imgContainer.appendChild(bDiv);
            }

            addBadgeSelector(imgContainer, player.name);

            imgContainer.onclick = () => {
                const fInp = document.createElement('input');
                fInp.type = 'file';
                fInp.onchange = (e) => handleImageUpload(e.target.files[0], player.name);
                fInp.click();
            };

            imgContainer.ondragover = (e) => e.preventDefault();
            imgContainer.ondrop = (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length) handleImageUpload(e.dataTransfer.files[0], player.name);
            };

            card.appendChild(imgContainer);
            
            const info = document.createElement('div');
            info.className = 'player-info';
            info.contentEditable = 'true';
            setTimeout(() => renderPlayerName(info, player), 10);
            
            info.onblur = () => {
                const names = JSON.parse(localStorage.getItem(CUSTOM_NAMES_KEY) || '{}');
                names[player.name] = info.textContent;
                localStorage.setItem(CUSTOM_NAMES_KEY, JSON.stringify(names));
            };

            // TRUE SWAP LOGIC
            card.ondragstart = (e) => { if(!e.dataTransfer.files.length) draggedElement = card; };
            card.ondragover = (e) => e.preventDefault();
            card.ondrop = (e) => {
                if (e.dataTransfer.files.length) return;
                if (draggedElement && draggedElement !== card) {
                    const p = card.parentElement;
                    const temp = document.createElement('div');
                    p.insertBefore(temp, draggedElement);
                    p.insertBefore(draggedElement, card);
                    p.insertBefore(card, temp);
                    p.removeChild(temp);
                }
            };

            return card;
        }

        function addBadgeSelector(container, playerName) {
            const selector = document.createElement('div');
            selector.className = 'badge-selector';
            const sel = document.createElement('select');
            sel.innerHTML = '<option value="none">None</option><option value="C">C</option><option value="A">A</option><option value="★">★</option>';
            sel.onclick = (e) => e.stopPropagation();
            sel.onchange = () => {
                const b = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
                if (sel.value === 'none') delete b[playerName]; else b[playerName] = sel.value;
                localStorage.setItem(BADGE_STORAGE_KEY, JSON.stringify(b));
                location.reload();
            };
            selector.appendChild(sel);
            container.appendChild(selector);
        }

        function createStaffMember(type, index) {
            const staffData = JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY) || '{}');
            const key = `staff_${type}_${index}`;
            const saved = staffData[key] || {};
            
            let pre = {};
            if (type === 'Goalie' && GOALIES[index-1]) pre = { name: GOALIES[index-1].name, image: GOALIES[index-1].headshot_url, role: 'GOALIE' };
            else if (type === 'Coach' && COACHES[index-1]) pre = { name: COACHES[index-1].name, image: COACHES[index-1].headshot_url, role: COACHES[index-1].role };
            
            const data = (saved.name || saved.image) ? saved : pre;
            const member = document.createElement('div');
            member.className = 'staff-member';
            if (type === 'Coach' && index === 4 && localStorage.getItem(COACH_TOGGLE_KEY) !== 'true') member.classList.add('hidden-coach');

            const imgCont = document.createElement('div');
            imgCont.className = 'staff-img-container';
            
            const rInp = document.createElement('div');
            rInp.className = 'staff-role'; rInp.contentEditable = "true";
            rInp.textContent = saved.role || pre.role || type.toUpperCase();
            rInp.onblur = () => { staffData[key] = staffData[key] || {}; staffData[key].role = rInp.textContent; localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(staffData)); };
            imgCont.appendChild(rInp);

            if (data.image) {
                const img = document.createElement('img'); img.src = data.image; img.className = 'player-img'; img.style.transform = 'none';
                imgCont.appendChild(img);
            } else {
                imgCont.innerHTML += '<div class="placeholder">?</div>';
            }

            imgCont.onclick = () => {
                const f = document.createElement('input'); f.type = 'file';
                f.onchange = (e) => handleImageUpload(e.target.files[0], null, true, key);
                f.click();
            };

            member.appendChild(imgCont);
            const nInp = document.createElement('input');
            nInp.className = 'staff-name-input'; nInp.value = data.name || '';
            nInp.placeholder = type === 'Coach' ? "COACH" : "NAME";
            nInp.oninput = () => { staffData[key] = staffData[key] || {}; staffData[key].name = nInp.value; localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(staffData)); };
            member.appendChild(nInp);
            return member;
        }

        function initDraggable() {
            const controls = document.getElementById('draggable-controls');
            let isDragging = false;
            let offset = { x: 0, y: 0 };
            controls.onmousedown = (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;
                isDragging = true;
                offset.x = e.clientX - controls.offsetLeft;
                offset.y = e.clientY - controls.offsetTop;
            };
            document.onmousemove = (e) => {
                if (!isDragging) return;
                controls.style.left = (e.clientX - offset.x) + 'px';
                controls.style.top = (e.clientY - offset.y) + 'px';
                controls.style.right = 'auto';
            };
            document.onmouseup = () => isDragging = false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const fGrid = document.getElementById('forwards-grid');
            const dGrid = document.getElementById('defensemen-grid');
            const gRow = document.getElementById('goalie-row');
            const cRow = document.getElementById('coach-row');
            
            FORWARDS.forEach(p => fGrid.appendChild(createPlayerCard(p)));
            DEFENSEMEN.forEach(p => dGrid.appendChild(createPlayerCard(p)));
            
            gRow.appendChild(createStaffMember('Goalie', 1));
            gRow.appendChild(createStaffMember('Goalie', 2));
            const notes = document.createElement('div');
            notes.className = 'notes-area';
            notes.innerHTML = `<textarea id="notes-input" placeholder="NOTES..."></textarea>`;
            gRow.appendChild(notes);
            
            const nInp = document.getElementById('notes-input');
            nInp.value = localStorage.getItem(NOTES_KEY) || "";
            nInp.oninput = () => localStorage.setItem(NOTES_KEY, nInp.value);

            cRow.appendChild(createStaffMember('Coach', 1));
            cRow.appendChild(createStaffMember('Coach', 2));
            cRow.appendChild(createStaffMember('Coach', 3));
            cRow.appendChild(createStaffMember('Coach', 4));

            initDraggable();
        });
    </script>
</body>
</html>
