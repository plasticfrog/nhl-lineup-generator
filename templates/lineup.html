<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NHL Team Lineup</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        @page { margin: 0; size: letter portrait; }
        
        html, body {
            height: 100%; width: 100%;
            background: #111; display: flex; justify-content: center;
            font-family: 'Arial Narrow', Arial, sans-serif;
            overflow-x: hidden;
        }
        
        .container {
            background: white; width: 8.5in; height: 11in;
            display: flex; flex-direction: column; position: relative;
            flex-shrink: 0; overflow: hidden;
        }
        
        .forwards-section { height: 48%; width: 100%; display: flex; flex-direction: column; }
        .defensemen-section { height: 52%; display: flex; border-top: var(--group-rule) solid black; }
        
        :root {
            --mug: 300px;      /* one headshot size for every card so faces match across sections */
            --headroom: 15px;  /* space between the top of every card and the top of the hair */
            --rule: 1px;       /* line between cards */
            --group-rule: 5px; /* line between groups */
        }

        /* Cards are spaced by one rule width and outlined, so neighbors share a single line
           (and an unfilled slot stays white) */
        .player, .staff-member, .notes-area { outline: var(--rule) solid #000; }
        .forwards-grid {
            display: grid; height: 100%; gap: var(--rule);
            grid-template-columns: repeat(3, 1fr) calc(var(--group-rule) - 2 * var(--rule)) repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }
        .forwards-grid .player:nth-child(6n+4) { grid-column-start: 5; }
        /* Thick line between the two lines in each row */
        .forwards-grid .player:nth-child(6n+3) { box-shadow: calc(var(--group-rule) - var(--rule)) 0 0 #000; }

        .defensemen-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr);
            width: 40%; height: 100%; gap: var(--rule);
        }
        
        .staff-grid {
            display: flex; flex-direction: column;
            width: 60%; height: 100%; border-left: var(--group-rule) solid black;
        }

        .staff-row { display: flex; height: 50%; width: 100%; gap: var(--rule); }
        .coach-row { border-top: var(--group-rule) solid black; flex: 1; }

        .staff-member {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; position: relative;
            min-width: 0; height: 100%;
        }
        .staff-member.hidden-coach { display: none !important; }
        /* Name bars in the team color, like the MLB sheet (the "Black Name Bars" button turns this off) */
        body.team-fill .info-bar { background: var(--team-color, #000) !important; color: var(--team-text, #fff) !important; }
        .player.dragging, .staff-member.dragging { opacity: 0.35; }
        .staff-member.starter-active { box-shadow: inset 0 0 0 8px #FFD700 !important; z-index: 50; }

        .notes-area { flex: 1.5; height: 100%; position: relative; overflow: hidden; background: #fff; }
        .notes-area textarea { 
            width: 100%; height: 100%; border: none; padding: 10px; 
            font-size: 0.95em; font-weight: 900; resize: none; outline: none; 
            text-transform: uppercase; background: transparent; position: relative; z-index: 1; 
        }
        
        .note-image-wrapper { position: absolute; cursor: move; z-index: 10; border: 1px dashed transparent; }
        .note-image-wrapper:hover, .note-image-wrapper.selected { border-color: #FFD700; }
        .note-image-wrapper img { width: 100%; height: 100%; pointer-events: none; display: block; object-fit: cover; }
        .handle { position: absolute; width: 12px; height: 12px; background: #FFD700; border: 1px solid #000; display: none; }
        .note-image-wrapper.selected .handle { display: block; }

        .player { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .img-container { flex: 1; position: relative; background: #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .info-bar {
            height: 18px !important; min-height: 18px !important;
            background: #000 !important; color: #fff !important;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 1.0em; font-weight: 900;
            text-transform: uppercase; width: 100%; flex-shrink: 0; z-index: 10; border: none; outline: none;
            line-height: 0.9;
        }

        .badge {
            position: absolute; top: 4px; left: 4px;
            color: white; z-index: 20; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            padding: 2px 6px; border: 2px solid white;
        }
        .badge svg { width: 18px; height: 18px; fill: white; }
        .badge[data-type="star"] { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .badge[data-type="star"] svg { fill: #000; }
        .badge[data-type="captain"] { background: #000; }
        .badge[data-type="alternate"] { background: #333; }
        
        .text-badge {
            position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9) !important; color: white !important;
            padding: 1px 8px; font-size: 0.55em; font-weight: 900;
            border-radius: 2px; z-index: 25; border: 1px solid white;
            white-space: nowrap; text-transform: uppercase;
        }

        .find-btn {
            position: absolute; bottom: 4px; right: 4px;
            background: rgba(255,255,255,0.8); border: 1px solid black;
            font-size: 10px; padding: 2px 5px; font-weight: 900;
            cursor: pointer; z-index: 40; opacity: 0;
        }
        .img-container:hover .find-btn, .img-container:hover .badge-selector { opacity: 1; }
        .badge-selector { position: absolute; top: 2px; right: 2px; z-index: 30; opacity: 0; }
        
        /* Same size in every card, hair (~17% down the NHL mug) pinned just below the top of
           the card, and never a gap at the top or bottom. Option+scroll/drag adjusts via transform. */
        .headshot {
            position: absolute; width: var(--mug); height: var(--mug); object-fit: cover;
            left: calc(50% - var(--mug) / 2);
            top: clamp(calc(100% - var(--mug)), calc(var(--headroom) - var(--mug) * 0.17), 0px);
            transform-origin: 50% 40%;
        }

        .role-label {
            position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9) !important; color: white !important;
            padding: 1px 8px; font-size: 0.6em; font-weight: 900;
            border-radius: 2px; z-index: 60; border: 1px solid white;
            white-space: nowrap; cursor: text;
        }
        
        .controls {
            position: fixed; top: 10px; right: 10px; background: white; padding: 10px;
            border: 2px solid black; border-radius: 8px; z-index: 5000; cursor: move;
            display: flex; flex-direction: column; gap: 4px;
        }
        .controls button { padding: 6px 10px; font-size: 12px; font-weight: 900; cursor: pointer; border: 1px solid black; background: #fff; text-transform: uppercase; }
        .controls button:hover { background: #000; color: #fff; }
        .controls .legend {
            margin-top: 4px; padding-top: 6px; border-top: 1px solid #ccc;
            font-family: Arial, sans-serif; font-size: 10px; line-height: 1.6; color: #444;
        }
        .controls .legend b { color: #000; }

        @media print {
            body, html { background: white !important; overflow: hidden !important; height: 11in !important; }
            .container { position: absolute !important; top: 0 !important; left: 0 !important; margin: 0 !important; box-shadow: none !important; }
            .controls, .badge-selector, .find-btn, .handle { display: none !important; }
            .note-image-wrapper { border: none !important; }
            textarea::placeholder { color: transparent !important; }
        }
    </style>
</head>
<body>
    <div class="controls" id="draggable-controls">
        <button onclick="window.scrollTo(0,0); window.print();">Print</button>
        <button onclick="toggleFourthCoach()">Add/Remove 4th Coach</button>
        <button onclick="clearAllData()">Reset to Original</button>
        <button id="name-bar-btn" onclick="toggleNameBars()">Black Name Bars</button>
        <div class="legend">
            <b>Double-click</b> photo to replace<br>
            <b>Drag & drop</b> an image onto a photo<br>
            <b>Option + scroll</b> over photo to zoom<br>
            <b>Option + drag</b> photo to move it<br>
            <b>Option + double-click</b> to reset photo<br>
            <b>Drag</b> a card onto another to swap<br>
            <b>Click</b> a name or title to edit<br>
            <b>Hover</b> photo for badges &amp; 🔍 Find
        </div>
    </div>

    <div class="container" id="lineup-content">
        <div class="forwards-section">
            <div class="forwards-grid" id="forwards-grid"></div>
        </div>
        <div class="defensemen-section">
            <div class="defensemen-grid" id="defensemen-grid"></div>
            <div class="staff-grid">
                <div class="staff-row">
                    <div id="g1-slot" class="staff-member"></div>
                    <div id="g2-slot" class="staff-member"></div>
                    <div class="notes-area" id="notes-area">
                        <textarea id="notes-input" placeholder="NOTES..."></textarea>
                    </div>
                </div>
                <div class="staff-row coach-row" id="coach-container"></div>
            </div>
        </div>
    </div>

    <script>
        const lineupData = JSON.parse(localStorage.getItem('lineup_data') || '{}');
        const STORAGE_KEY = 'nhl_lineup_custom_images_nogap';
        const BADGE_STORAGE_KEY = 'nhl_lineup_badges';
        const CUSTOM_BADGE_TEXT_KEY = 'nhl_lineup_custom_badge_text';
        const STAFF_STORAGE_KEY = 'nhl_lineup_staff';
        const CUSTOM_NAMES_KEY = 'nhl_lineup_custom_names';
        const COACH_TOGGLE_KEY = 'nhl_show_fourth_coach';
        const LAST_TEAM_KEY = 'nhl_last_team_id';
        const NOTES_KEY = 'notes';
        const NOTE_IMGS_KEY = 'nhl_note_images';
        const PHOTO_ADJUST_KEY = 'nhl_photo_adjust';   // { cardKey: { s, x, y } } zoom/position per photo
        const CARD_ORDER_KEY = 'nhl_card_order';       // where each card was dragged to, for this lineup

        // Identifies this exact lineup, so a saved order is never applied to a newly generated one
        const lineupSig = () => JSON.stringify([currentTeam, (lineupData.forwards || []).map(p => p.name), (lineupData.defensemen || []).map(p => p.name)]);
        const ORDER_SLOTS = { forwards: 'forwards-grid', defensemen: 'defensemen-grid', goalies: ['g1-slot', 'g2-slot'], coaches: 'coach-container' };
        const cardsIn = slot => Array.isArray(slot)
            ? slot.map(id => document.getElementById(id).firstElementChild).filter(Boolean)
            : [...document.getElementById(slot).children];

        function saveCardOrder() {
            const order = { sig: lineupSig() };
            for (const [name, slot] of Object.entries(ORDER_SLOTS)) order[name] = cardsIn(slot).map(c => c.dataset.key);
            writeJSON(CARD_ORDER_KEY, order);
        }

        function restoreCardOrder() {
            const order = readJSON(CARD_ORDER_KEY);
            if (order.sig !== lineupSig()) return;
            const byKey = {};
            for (const slot of Object.values(ORDER_SLOTS)) cardsIn(slot).forEach(c => byKey[c.dataset.key] = c);
            for (const [name, slot] of Object.entries(ORDER_SLOTS)) {
                const keys = (order[name] || []).filter(k => byKey[k]);
                if (Array.isArray(slot)) keys.forEach((k, i) => slot[i] && document.getElementById(slot[i]).appendChild(byKey[k]));
                else keys.forEach(k => document.getElementById(slot).appendChild(byKey[k]));
            }
        }

        // Swap two cards anywhere on the sheet (forward <-> D, goalie <-> goalie, coach <-> coach)
        function swapCards(a, b) {
            if (!a || !b || a === b || a.dataset.group !== b.dataset.group) return;
            const marker = document.createElement('div');
            a.parentNode.insertBefore(marker, a);
            b.parentNode.insertBefore(a, b);
            marker.parentNode.insertBefore(b, marker);
            marker.remove();
            saveCardOrder();
        }
        // Coach memory survives new lineups and resets:
        const COACH_PHOTOS_KEY = 'nhl_coach_photos';   // { 'COACH NAME': imageDataUrl } (only if the server upload failed)
        const TEAM_COACHES_KEY = 'nhl_team_coaches';   // { TEAM: { staff_Coach_N: { name, role, image } } }
        const NAME_BARS_KEY = 'nhl_name_bars';         // 'black' for plain black name bars; team color otherwise
        const KEEP_KEYS = ['lineup_data', COACH_PHOTOS_KEY, TEAM_COACHES_KEY, COACH_TOGGLE_KEY, NAME_BARS_KEY];

        const currentTeam = lineupData.team || 'Unknown';

        function resetLineupStorage() {
            const keep = KEEP_KEYS.map(k => [k, localStorage.getItem(k)]);
            localStorage.clear();
            keep.forEach(([k, v]) => { if (v !== null) localStorage.setItem(k, v); });
            localStorage.setItem(LAST_TEAM_KEY, currentTeam);
        }

        // Coach photos saved on the server, shared by everyone: { slug: url }
        let SERVER_PHOTOS = {};
        function photoSlug(name) {
            return (name || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }
        function coachPhotoFor(name) {
            if (!name) return null;
            return SERVER_PHOTOS[photoSlug(name)] || readJSON(COACH_PHOTOS_KEY)[name] || null;
        }

        function readJSON(key) { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; } }
        function writeJSON(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); return true; }
            catch (e) { alert('Browser storage is full. Remove some custom photos and try again.'); return false; }
        }

        function getTeamCoach(key) { return (readJSON(TEAM_COACHES_KEY)[currentTeam] || {})[key] || {}; }
        function saveTeamCoach(key, fields) {
            const all = readJSON(TEAM_COACHES_KEY);
            all[currentTeam] = all[currentTeam] || {};
            all[currentTeam][key] = Object.assign(all[currentTeam][key] || {}, fields);
            return writeJSON(TEAM_COACHES_KEY, all);
        }

        // Shrink dropped photos so dozens of coaches fit in browser storage
        function shrinkImage(dataUrl, maxSide = 400) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
                    const ctx = c.getContext('2d');
                    ctx.drawImage(img, 0, 0, c.width, c.height);
                    const webp = c.toDataURL('image/webp', 0.9);
                    if (webp.startsWith('data:image/webp')) return resolve(webp);
                    ctx.globalCompositeOperation = 'destination-over';
                    ctx.fillStyle = '#eee'; ctx.fillRect(0, 0, c.width, c.height);
                    resolve(c.toDataURL('image/jpeg', 0.9));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        if (localStorage.getItem(LAST_TEAM_KEY) !== currentTeam) resetLineupStorage();

        let draggedElement = null;

        function fitText(el) {
            let fontSize = 1.0; 
            el.style.fontSize = fontSize + 'em';
            el.style.whiteSpace = 'nowrap';
            while (el.scrollWidth > el.clientWidth && fontSize > 0.7) {
                fontSize -= 0.05;
                el.style.fontSize = fontSize + 'em';
            }
            if (el.scrollWidth > el.clientWidth) {
                el.style.whiteSpace = 'normal';
                while (el.scrollHeight > el.clientHeight && fontSize > 0.55) {
                    fontSize -= 0.05;
                    el.style.fontSize = fontSize + 'em';
                }
            }
        }

        function clearAllData() {
            if(confirm('Reset all changes? (Saved coach names and photos are kept.)')) {
                resetLineupStorage();
                location.reload();
            }
        }

        // Name bar color per team: the primary color, or a secondary one where the primary is black
        const TEAM_COLORS = {
            ANA: '#F47A38', BOS: '#FFB81C', BUF: '#003087', CAR: '#CE1126', CBJ: '#002654', CGY: '#C8102E',
            CHI: '#CF0A2C', COL: '#6F263D', DAL: '#006847', DET: '#CE1126', EDM: '#FF4C00', FLA: '#C8102E',
            LAK: '#A2AAAD', MIN: '#154734', MTL: '#AF1E2D', NJD: '#CE1126', NSH: '#FFB81C', NYI: '#00539B',
            NYR: '#0038A8', OTT: '#DA1A32', PHI: '#F74902', PIT: '#FCB514', SEA: '#99D9D9', SJS: '#006D75',
            STL: '#002F87', TBL: '#002868', TOR: '#00205B', UTA: '#71AFE5', VAN: '#00843D', VGK: '#B4975A',
            WPG: '#004C97', WSH: '#C8102E'
        };

        // Black text on light team colors (gold, silver, ice blue), white on the rest
        function textColorFor(hex) {
            const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
                .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
            return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.3 ? '#000' : '#fff';
        }

        function applyNameBars() {
            const black = localStorage.getItem(NAME_BARS_KEY) === 'black';
            const color = TEAM_COLORS[currentTeam] || '#666666';
            document.body.classList.toggle('team-fill', !black);
            document.body.style.setProperty('--team-color', color);
            document.body.style.setProperty('--team-text', textColorFor(color));
            document.getElementById('name-bar-btn').textContent = black ? 'Team Color Name Bars' : 'Black Name Bars';
        }

        function toggleNameBars() {
            localStorage.setItem(NAME_BARS_KEY, localStorage.getItem(NAME_BARS_KEY) === 'black' ? 'team' : 'black');
            applyNameBars();
        }

        // Chrome's default drag preview snapshots everything the oversized photo overlaps, so it
        // shows neighboring players too. Draw the preview ourselves: just this card, as it looks.
        function startCardDrag(e, card) {
            if (e.dataTransfer.files.length) return;
            draggedElement = card;
            card.classList.add('dragging');
            card.addEventListener('dragend', () => card.classList.remove('dragging'), { once: true });

            const box = card.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const canvas = document.createElement('canvas');
            canvas.width = box.width * dpr; canvas.height = box.height * dpr;
            canvas.style.cssText = `position:fixed; left:-10000px; top:0; width:${box.width}px; height:${box.height}px;`;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            const photoBox = card.querySelector('.img-container').getBoundingClientRect();
            ctx.fillStyle = '#eee'; ctx.fillRect(0, 0, box.width, box.height);
            const img = card.querySelector('.headshot');
            if (img && img.complete && img.naturalWidth) {
                const r = img.getBoundingClientRect();
                ctx.save();
                ctx.beginPath(); ctx.rect(0, 0, box.width, photoBox.bottom - box.top); ctx.clip();
                ctx.drawImage(img, r.left - box.left, r.top - box.top, r.width, r.height);
                ctx.restore();
            }
            const bar = card.querySelector('.info-bar');
            if (bar) {
                const b = bar.getBoundingClientRect(), st = getComputedStyle(bar);
                ctx.fillStyle = st.backgroundColor; ctx.fillRect(b.left - box.left, b.top - box.top, b.width, b.height);
                ctx.fillStyle = st.color; ctx.font = `${st.fontWeight} ${st.fontSize} ${st.fontFamily}`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(bar.textContent.toUpperCase(), b.left - box.left + b.width / 2, b.top - box.top + b.height / 2 + 1, b.width - 4);
            }
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, box.width - 2, box.height - 2);
            document.body.appendChild(canvas);
            e.dataTransfer.setDragImage(canvas, e.clientX - box.left, e.clientY - box.top);
            setTimeout(() => canvas.remove(), 0);
        }

        function toggleFourthCoach() {
            const cur = localStorage.getItem(COACH_TOGGLE_KEY) === 'true';
            localStorage.setItem(COACH_TOGGLE_KEY, !cur);
            location.reload();
        }

        // Option+scroll zooms, Option+drag moves, Option+double-click resets. Saved per card.
        function enablePhotoAdjust(imgCont, card, adjustKey) {
            const img = imgCont.querySelector('.headshot');
            if (!img) return;
            img.draggable = false;
            let adj = Object.assign({ s: 1, x: 0, y: 0 }, readJSON(PHOTO_ADJUST_KEY)[adjustKey]);
            const apply = () => { img.style.transform = `translate(${adj.x}px, ${adj.y}px) scale(${adj.s})`; };
            const save = () => { const all = readJSON(PHOTO_ADJUST_KEY); all[adjustKey] = adj; writeJSON(PHOTO_ADJUST_KEY, all); };
            apply();

            imgCont.addEventListener('wheel', e => {
                if (!e.altKey) return;
                e.preventDefault();
                adj.s = Math.max(0.5, Math.min(4, adj.s + (e.deltaY > 0 ? -0.03 : 0.03)));
                apply(); save();
            }, { passive: false });

            imgCont.addEventListener('mousedown', e => {
                if (!e.altKey || e.button !== 0) return;
                e.preventDefault(); e.stopPropagation();
                card.draggable = false;  // don't start a card swap while moving the photo
                imgCont.style.cursor = 'grabbing';
                const start = { mx: e.clientX, my: e.clientY, x: adj.x, y: adj.y };
                const move = ev => { adj.x = start.x + ev.clientX - start.mx; adj.y = start.y + ev.clientY - start.my; apply(); };
                const up = () => {
                    window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
                    card.draggable = true; imgCont.style.cursor = ''; save();
                };
                window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
            });

            imgCont.addEventListener('dblclick', e => {
                if (!e.altKey) return;
                e.stopImmediatePropagation();
                adj = { s: 1, x: 0, y: 0 }; apply();
                const all = readJSON(PHOTO_ADJUST_KEY); delete all[adjustKey]; writeJSON(PHOTO_ADJUST_KEY, all);
            });
        }

        // Double-click (not single click) opens the file picker
        function enableDoubleClickUpload(imgCont, onFile) {
            imgCont.addEventListener('dblclick', e => {
                if (e.altKey || e.target.closest('select, .find-btn, .role-label, .text-badge')) return;
                const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
                f.onchange = ev => onFile(ev.target.files[0]);
                f.click();
            });
        }

        function clearPhotoAdjust(adjustKey) {
            const all = readJSON(PHOTO_ADJUST_KEY);
            if (adjustKey in all) { delete all[adjustKey]; writeJSON(PHOTO_ADJUST_KEY, all); }
        }

        function handleImageUpload(file, playerName, isStaff, key, coachName) {
            if(!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                clearPhotoAdjust(playerName || key);  // a new photo starts un-zoomed
                if (coachName !== undefined) {
                    // Coaches: save the photo on the server by name so everyone gets it on every future lineup
                    const src = await shrinkImage(e.target.result);
                    if (coachName) {
                        const photos = readJSON(COACH_PHOTOS_KEY);
                        try {
                            const form = new FormData();
                            form.append('name', coachName);
                            form.append('photo', file);
                            const res = await fetch('/coach_photos', { method: 'POST', body: form });
                            if (!res.ok) throw new Error((await res.json()).error || res.status);
                            delete photos[coachName];
                            writeJSON(COACH_PHOTOS_KEY, photos);
                        } catch (err) {
                            alert(`Couldn't save the photo for everyone (${err.message}). It's saved in this browser only.`);
                            photos[coachName] = src;
                            if (!writeJSON(COACH_PHOTOS_KEY, photos)) return;
                        }
                    } else if (!saveTeamCoach(key, { image: src })) return;
                } else if(isStaff) {
                    const data = JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY) || '{}');
                    data[key] = data[key] || {}; data[key].image = e.target.result;
                    localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(data));
                } else {
                    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    data[playerName] = e.target.result;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                }
                location.reload();
            };
            reader.readAsDataURL(file);
        }

        function triggerMagicSearch(name, isStaff) {
            const suffix = isStaff ? " hockey coach" : " hockey headshot";
            const query = encodeURIComponent(name + suffix);
            window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank');
        }

        const STAR_SVG = `<svg viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>`;

        function createPlayerCard(player) {
            const card = document.createElement('div');
            card.className = 'player'; card.draggable = true;
            card.dataset.key = player.name; card.dataset.group = 'skater';
            const imgCont = document.createElement('div');
            imgCont.className = 'img-container';
            const customImgs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const url = customImgs[player.name] || player.headshot_url;
            if (url) {
                const img = document.createElement('img'); img.src = url; img.className = 'headshot';
                imgCont.appendChild(img);
            } else { imgCont.innerHTML = '<div style="font-size:3em;color:#ccc;font-weight:900">?</div>'; }

            const badges = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
            const bType = badges[player.name];
            if (bType && bType !== 'none') {
                if (bType === 'Text') {
                    const tb = document.createElement('div'); tb.className = 'text-badge'; tb.contentEditable = "true";
                    const customTexts = JSON.parse(localStorage.getItem(CUSTOM_BADGE_TEXT_KEY) || '{}');
                    tb.textContent = customTexts[player.name] || 'TEXT';
                    tb.onclick = e => e.stopPropagation();
                    tb.onblur = () => {
                        const texts = JSON.parse(localStorage.getItem(CUSTOM_BADGE_TEXT_KEY) || '{}');
                        texts[player.name] = tb.textContent; localStorage.setItem(CUSTOM_BADGE_TEXT_KEY, JSON.stringify(texts));
                    };
                    imgCont.appendChild(tb);
                } else {
                    const b = document.createElement('div'); b.className = 'badge'; b.dataset.type = bType === '★' ? 'star' : (bType === 'C' ? 'captain' : 'alternate');
                    b.innerHTML = (bType === '★') ? STAR_SVG : bType;
                    imgCont.appendChild(b);
                }
            }

            const info = document.createElement('div'); 
            info.className = 'info-bar'; info.contentEditable = 'true';
            const customNames = JSON.parse(localStorage.getItem(CUSTOM_NAMES_KEY) || '{}');
            if (customNames[player.name]) { info.textContent = customNames[player.name]; } 
            else { const n = player.number || ''; const l = player.name.split(' ').pop(); info.textContent = n ? `#${n} ${l}` : l; }
            
            info.oninput = () => {
                const n = JSON.parse(localStorage.getItem(CUSTOM_NAMES_KEY) || '{}');
                n[player.name] = info.textContent; localStorage.setItem(CUSTOM_NAMES_KEY, JSON.stringify(n));
                fitText(info);
            };

            const fBtn = document.createElement('div'); fBtn.className = 'find-btn'; fBtn.textContent = "🔍 FIND";
            fBtn.onclick = (e) => { e.stopPropagation(); triggerMagicSearch(info.textContent, false); };
            imgCont.appendChild(fBtn);

            addBadgeSelector(imgCont, player.name);
            enablePhotoAdjust(imgCont, card, player.name);
            enableDoubleClickUpload(imgCont, file => handleImageUpload(file, player.name));
            imgCont.ondragover = e => e.preventDefault();
            imgCont.ondrop = e => { e.preventDefault(); if(e.dataTransfer.files[0]) handleImageUpload(e.dataTransfer.files[0], player.name); };
            
            card.appendChild(imgCont); card.appendChild(info);
            setTimeout(() => fitText(info), 10);

            card.ondragstart = e => startCardDrag(e, card);
            card.ondragover = e => e.preventDefault();
            card.ondrop = e => {
                if (e.dataTransfer.files.length) return;
                swapCards(draggedElement, card);
            };
            return card;
        }

        function addBadgeSelector(container, playerName, isStaffSlot = false) {
            const selector = document.createElement('div');
            selector.className = 'badge-selector';
            const sel = document.createElement('select');
            let options = '<option value="none">None</option><option value="C">C</option><option value="A">A</option><option value="★">★</option><option value="Text">Text</option>';
            if (isStaffSlot) options += '<option value="Starter">Starter</option>';
            sel.innerHTML = options;
            const badges = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
            sel.value = badges[playerName] || 'none';
            sel.onclick = e => e.stopPropagation();
            sel.onchange = () => {
                const b = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
                if(sel.value === 'none') delete b[playerName]; else b[playerName] = sel.value;
                localStorage.setItem(BADGE_STORAGE_KEY, JSON.stringify(b));
                location.reload();
            };
            selector.appendChild(sel);
            container.appendChild(selector);
        }

        function createStaffMember(type, index) {
            const staffData = JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY) || '{}');
            const key = `staff_${type}_${index}`;
            const isCoach = type === 'Coach';
            // Coach edits are remembered per team; goalie edits last for this lineup only
            const saved = isCoach ? getTeamCoach(key) : (staffData[key] || {});
            const pre = type === 'Goalie' ? (lineupData.goalies[index-1] || {}) : (lineupData.coaches[index-1] || {});
            const saveStaff = fields => {
                if (isCoach) return saveTeamCoach(key, fields);
                const d = readJSON(STAFF_STORAGE_KEY); d[key] = Object.assign(d[key] || {}, fields);
                return writeJSON(STAFF_STORAGE_KEY, d);
            };

            const member = document.createElement('div'); member.className = 'staff-member';
            member.dataset.key = key; member.dataset.group = type;
            member.draggable = true; // COACH DRAGGING ENABLED

            const badges = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
            const staffName = saved.name !== undefined ? saved.name : (pre.name || "");
            
            let isStarter = type === 'Goalie' && badges[staffName] === 'Starter';
            if (isStarter) member.classList.add('starter-active');
            if (type === 'Coach' && index === 4 && localStorage.getItem(COACH_TOGGLE_KEY) !== 'true') member.classList.add('hidden-coach');

            const imgCont = document.createElement('div'); imgCont.className = 'img-container';
            
            // Fix badges for staff
            const bType = badges[staffName];
            if (bType && bType !== 'none' && bType !== 'Starter') {
                if (bType === 'Text') {
                    const tb = document.createElement('div'); tb.className = 'text-badge'; tb.contentEditable = "true";
                    const customTexts = JSON.parse(localStorage.getItem(CUSTOM_BADGE_TEXT_KEY) || '{}');
                    tb.textContent = customTexts[staffName] || 'TEXT';
                    tb.onclick = e => e.stopPropagation();
                    tb.onblur = () => {
                        const t = JSON.parse(localStorage.getItem(CUSTOM_BADGE_TEXT_KEY) || '{}');
                        t[staffName] = tb.textContent; localStorage.setItem(CUSTOM_BADGE_TEXT_KEY, JSON.stringify(t));
                    };
                    imgCont.appendChild(tb);
                } else {
                    const b = document.createElement('div'); b.className = 'badge'; b.dataset.type = bType === '★' ? 'star' : (bType === 'C' ? 'captain' : 'alternate');
                    b.innerHTML = (bType === '★') ? STAR_SVG : bType;
                    imgCont.appendChild(b);
                }
            }

            const role = document.createElement('div');
            role.className = 'role-label'; role.contentEditable = "true";
            role.textContent = isStarter ? '*STARTING GOALIE*' : (saved.role || pre.role || type.toUpperCase());
            role.addEventListener('mousedown', e => e.stopPropagation());
            role.addEventListener('click', e => e.stopPropagation());
            role.onblur = () => saveStaff({ role: role.textContent });
            imgCont.appendChild(role);

            const coachPhoto = isCoach ? coachPhotoFor(staffName) : null;
            const url = coachPhoto || saved.image || pre.headshot_url || pre.image;
            if (url) {
                const img = document.createElement('img'); img.src = url; img.className = 'headshot';
                imgCont.appendChild(img);
            } else { imgCont.innerHTML += '<div style="font-size:2em;color:#ccc;font-weight:900">?</div>'; }

            const nameInfo = document.createElement('div'); nameInfo.className = 'info-bar'; nameInfo.contentEditable = 'true';
            nameInfo.textContent = staffName;
            nameInfo.oninput = () => {
                saveStaff({ name: nameInfo.textContent.trim().toUpperCase() });
                fitText(nameInfo);
            };
            // Show a remembered photo as soon as a known coach's name is typed in
            if (isCoach) nameInfo.onblur = () => {
                const photo = coachPhotoFor(nameInfo.textContent.trim().toUpperCase());
                if (photo && photo !== url) location.reload();
            };

            const fBtn = document.createElement('div'); fBtn.className = 'find-btn'; fBtn.textContent = "🔍 FIND";
            fBtn.onclick = (e) => { e.stopPropagation(); triggerMagicSearch(nameInfo.textContent, true); };
            imgCont.appendChild(fBtn);

            addBadgeSelector(imgCont, staffName, type === 'Goalie');
            
            const coachName = () => isCoach ? nameInfo.textContent.trim().toUpperCase() : undefined;
            enablePhotoAdjust(imgCont, member, key);
            enableDoubleClickUpload(imgCont, file => handleImageUpload(file, null, true, key, coachName()));
            imgCont.ondragover = e => e.preventDefault();
            imgCont.ondrop = e => { e.preventDefault(); if(e.dataTransfer.files[0]) handleImageUpload(e.dataTransfer.files[0], null, true, key, coachName()); };

            member.appendChild(imgCont); member.appendChild(nameInfo);
            setTimeout(() => fitText(nameInfo), 10);

            // STAFF DRAG SWAP LOGIC
            member.ondragstart = e => startCardDrag(e, member);
            member.ondragover = e => e.preventDefault();
            member.ondrop = e => {
                if (e.dataTransfer.files.length) return;
                swapCards(draggedElement, member);
            };

            return member;
        }

        function initNotesObjects() {
            const area = document.getElementById('notes-area');
            area.ondragover = e => e.preventDefault();
            area.ondrop = e => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = ev => createNoteImage(ev.target.result, e.offsetX, e.offsetY);
                    reader.readAsDataURL(file);
                }
            };
            const saved = JSON.parse(localStorage.getItem(NOTE_IMGS_KEY) || '[]');
            saved.forEach(data => createNoteImage(data.src, data.x, data.y, data.w, data.h, true));
        }

        function createNoteImage(src, x, y, w = 100, h = 100, isLoading = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'note-image-wrapper';
            wrapper.style.left = x + 'px'; wrapper.style.top = y + 'px';
            wrapper.style.width = w + 'px'; wrapper.style.height = h + 'px';
            const img = document.createElement('img'); img.src = src; wrapper.appendChild(img);
            ['nw', 'ne', 'sw', 'se'].forEach(pos => { const h = document.createElement('div'); h.className = `handle handle-${pos}`; wrapper.appendChild(h); });
            document.getElementById('notes-area').appendChild(wrapper);
            makeElementPowerPoint(wrapper);
            if (!isLoading) saveNoteImages();
        }

        function makeElementPowerPoint(el) {
            let isDown = false, isResizing = false, currentHandle = null;
            let startX, startY, startW, startH, startL, startT;
            el.onmousedown = e => {
                isDown = true;
                document.querySelectorAll('.note-image-wrapper').forEach(w => w.classList.remove('selected'));
                el.classList.add('selected');
                if (e.target.classList.contains('handle')) { isResizing = true; currentHandle = e.target; }
                startX = e.clientX; startY = e.clientY;
                startW = el.offsetWidth; startH = el.offsetHeight;
                startL = el.offsetLeft; startT = el.offsetTop;
                e.preventDefault();
            };
            window.addEventListener('mousemove', e => {
                if (!isDown) return;
                const dx = e.clientX - startX, dy = e.clientY - startY;
                if (isResizing) {
                    if (currentHandle.classList.contains('handle-se')) { el.style.width = startW + dx + 'px'; el.style.height = startH + dy + 'px'; }
                    else if (currentHandle.classList.contains('handle-sw')) { el.style.width = startW - dx + 'px'; el.style.height = startH + dy + 'px'; el.style.left = startL + dx + 'px'; }
                    else if (currentHandle.classList.contains('handle-nw')) { el.style.width = startW - dx + 'px'; el.style.height = startH - dy + 'px'; el.style.left = startL + dx + 'px'; el.style.top = startT + dy + 'px'; }
                    else if (currentHandle.classList.contains('handle-ne')) { el.style.width = startW + dx + 'px'; el.style.height = startH - dy + 'px'; el.style.top = startT + dy + 'px'; }
                } else { el.style.left = startL + dx + 'px'; el.style.top = startT + dy + 'px'; }
            });
            window.addEventListener('mouseup', () => { if (isDown) saveNoteImages(); isDown = false; isResizing = false; });
        }

        function saveNoteImages() {
            const imgs = [];
            document.querySelectorAll('.note-image-wrapper').forEach(w => {
                imgs.push({ src: w.querySelector('img').src, x: parseInt(w.style.left), y: parseInt(w.style.top), w: parseInt(w.style.width), h: parseInt(w.style.height) });
            });
            localStorage.setItem(NOTE_IMGS_KEY, JSON.stringify(imgs));
        }

        function initDraggable() {
            const controls = document.getElementById('draggable-controls');
            let isDragging = false, off = { x: 0, y: 0 };
            controls.onmousedown = (e) => { if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return; isDragging = true; off.x = e.clientX - controls.offsetLeft; off.y = e.clientY - controls.offsetTop; };
            document.onmousemove = (e) => { if (!isDragging) return; controls.style.left = (e.clientX - off.x) + 'px'; controls.style.top = (e.clientY - off.y) + 'px'; controls.style.right = 'auto'; };
            document.onmouseup = () => isDragging = false;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try { SERVER_PHOTOS = await fetch('/coach_photos').then(r => r.json()); } catch (e) { SERVER_PHOTOS = {}; }

            const fGrid = document.getElementById('forwards-grid');
            const dGrid = document.getElementById('defensemen-grid');
            const g1Slot = document.getElementById('g1-slot');
            const g2Slot = document.getElementById('g2-slot');
            const cCont = document.getElementById('coach-container');
            
            (lineupData.forwards || []).forEach(p => fGrid.appendChild(createPlayerCard(p)));
            (lineupData.defensemen || []).forEach(p => dGrid.appendChild(createPlayerCard(p)));
            
            g1Slot.appendChild(createStaffMember('Goalie', 1));
            g2Slot.appendChild(createStaffMember('Goalie', 2));
            
            const nInp = document.getElementById('notes-input');
            nInp.value = localStorage.getItem(NOTES_KEY) || "";
            nInp.oninput = () => localStorage.setItem(NOTES_KEY, nInp.value);

            cCont.appendChild(createStaffMember('Coach', 1));
            cCont.appendChild(createStaffMember('Coach', 2));
            cCont.appendChild(createStaffMember('Coach', 3));
            cCont.appendChild(createStaffMember('Coach', 4));

            restoreCardOrder();
            applyNameBars();
            initDraggable();
            initNotesObjects();
        });
    </script>
</body>
</html>
