<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NHL Team Lineup</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        
        @page { margin: 0; size: letter portrait; }
        
        html, body {
            min-height: 100%;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            font-family: 'Arial Narrow', Arial, sans-serif;
        }
        
        .container {
            background: white;
            width: 8.5in;
            height: 11in;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative;
            flex-shrink: 0;
            margin: 10px 0;
            overflow: hidden;
            padding-bottom: 3mm; /* SQUISH MARGIN */
        }
        
        .forwards-section { height: 55%; width: 100%; display: flex; flex-direction: column; }
        .defensemen-section { height: 45%; display: flex; border-top: 5px solid black; }
        
        .forwards-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(2, 1fr);
            height: 100%;
        }
        
        .forwards-grid .player:nth-child(3), .forwards-grid .player:nth-child(9) { border-right: 5px solid black; }
        
        .defensemen-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 45%; height: 100%;
        }
        
        .staff-grid {
            display: flex;
            flex-direction: column;
            width: 55%; height: 100%;
            border-left: 5px solid black;
        }
        
        .goalie-row { display: flex; height: 50%; width: 100%; }
        .coach-row { display: flex; height: 50%; border-top: 5px solid black; }
        
        .staff-member { flex: 1; display: flex; flex-direction: column; border-right: 1px solid black; overflow: hidden; position: relative; }
        .staff-member.hidden-coach { display: none !important; }

        /* Goalie Starter Outline */
        .staff-member.starter-active {
            box-shadow: inset 0 0 0 8px #FFD700 !important;
            z-index: 50;
        }

        .notes-area { flex: 1.2; height: 100%; border-left: 1px solid black; }
        .notes-area textarea {
            width: 100%; height: 100%; border: none; padding: 6px;
            font-size: 1em; font-weight: 900; resize: none; outline: none; text-transform: uppercase;
        }
        
        .player { display: flex; flex-direction: column; height: 100%; border: 0.1px solid #eee; overflow: hidden; }
        
        .img-container {
            flex: 1; position: relative; background: #eee;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        
        .info-bar {
            height: 22px !important;
            min-height: 22px !important;
            background: #000 !important;
            color: #fff !important;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 0.75em; font-weight: 900;
            text-transform: uppercase; width: 100%; flex-shrink: 0; z-index: 10;
        }

        .font-small { font-size: 0.65em !important; }
        .font-tiny { font-size: 0.55em !important; }
        
        .badge {
            position: absolute;
            top: 4px; left: 4px;
            color: white; font-weight: 900; font-size: 1.2em;
            padding: 2px 6px; border-radius: 4px; z-index: 20;
            text-shadow: 1px 1px 3px rgba(0,0,0,1);
            border: 2px solid white;
        }
        .badge[data-type="star"] { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
        .badge[data-type="captain"] { background: #000; }
        .badge[data-type="alternate"] { background: #333; }
        
        .badge-selector { position: absolute; top: 2px; right: 2px; z-index: 30; opacity: 0; }
        .img-container:hover .badge-selector { opacity: 1; }
        
        .headshot { width: 100%; height: 110%; object-fit: cover; transform: translateY(-2%); }
        .defensemen-grid .headshot { transform: translateY(0%); object-position: center 20%; }
        
        .staff-role-label {
            position: absolute;
            top: 4px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9) !important;
            color: white !important;
            padding: 1px 8px; font-size: 0.6em; font-weight: 900;
            border-radius: 2px; z-index: 60; border: 1px solid white;
            white-space: nowrap; cursor: text;
        }
        
        .controls {
            position: fixed;
            top: 10px; right: 10px;
            background: white; padding: 10px;
            border: 2px solid black; border-radius: 8px;
            z-index: 5000; cursor: move;
            display: flex; flex-direction: column; gap: 4px;
        }
        
        .controls button {
            padding: 6px 10px; font-size: 12px; font-weight: 900;
            cursor: pointer; border: 1px solid black; background: #fff;
            text-transform: uppercase;
        }
        .controls button:hover { background: #000; color: #fff; }

        @media print {
            body, html { background: white !important; overflow: hidden !important; height: 11in !important; width: 8.5in !important; }
            .container { position: absolute !important; top: 0 !important; left: 0 !important; margin: 0 !important; box-shadow: none !important; }
            .controls, .badge-selector { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="controls" id="draggable-controls">
        <button onclick="window.scrollTo(0,0); window.print();">Print</button>
        <button onclick="downloadPDF()">Download PDF</button>
        <button onclick="toggleFourthCoach()">Add/Remove 4th Coach</button>
        <button onclick="clearAllData()">Reset to Original</button>
    </div>

    <div class="container" id="lineup-content">
        <div class="forwards-section">
            <div class="forwards-grid" id="forwards-grid"></div>
        </div>
        
        <div class="defensemen-section">
            <div class="defensemen-grid" id="defensemen-grid"></div>
            <div class="staff-grid">
                <div class="goalie-row">
                    <div id="goalie-container" style="display: contents;"></div>
                    <div class="notes-area">
                        <textarea id="notes-input" placeholder="NOTES..."></textarea>
                    </div>
                </div>
                <div class="coach-row" id="coach-row"></div>
            </div>
        </div>
    </div>

    <script>
        const lineupData = JSON.parse(localStorage.getItem('lineup_data') || '{}');
        const STORAGE_KEY = 'nhl_lineup_custom_images_nogap';
        const BADGE_STORAGE_KEY = 'nhl_lineup_badges';
        const STAFF_STORAGE_KEY = 'nhl_lineup_staff';
        const CUSTOM_NAMES_KEY = 'nhl_lineup_custom_names';
        const LAST_TEAM_KEY = 'nhl_last_team_id';

        const currentTeam = lineupData.team || 'Unknown';
        if (localStorage.getItem(LAST_TEAM_KEY) !== currentTeam) {
            const backup = localStorage.getItem('lineup_data');
            localStorage.clear();
            localStorage.setItem('lineup_data', backup);
            localStorage.setItem(LAST_TEAM_KEY, currentTeam);
        }

        let draggedElement = null;

        function clearAllData() {
            if(confirm('Reset all changes?')) {
                const backup = localStorage.getItem('lineup_data');
                localStorage.clear();
                localStorage.setItem('lineup_data', backup);
                localStorage.setItem(LAST_TEAM_KEY, currentTeam);
                location.reload();
            }
        }

        function toggleFourthCoach() {
            const cur = localStorage.getItem('show_4th') === 'true';
            localStorage.setItem('show_4th', !cur);
            location.reload();
        }

        async function downloadPDF() {
            const element = document.getElementById('lineup-content');
            const controls = document.getElementById('draggable-controls');
            controls.style.display = 'none';
            window.scrollTo(0,0);
            
            const opt = {
                margin: 0,
                filename: `${currentTeam}_Headshots.pdf`,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { 
                    scale: 3, 
                    useCORS: true, 
                    logging: false,
                    scrollY: 0,
                    windowWidth: 816, // Force standard width
                    windowHeight: 1056 
                },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            
            setTimeout(async () => {
                await html2pdf().set(opt).from(element).save();
                controls.style.display = 'flex';
            }, 150);
        }

        function handleImageUpload(file, playerName, isStaff, key) {
            if(!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                if(isStaff) {
                    const data = JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY) || '{}');
                    data[key] = data[key] || {}; data[key].image = e.target.result;
                    localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(data));
                } else {
                    const imgs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    imgs[playerName] = e.target.result;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(imgs));
                }
                location.reload();
            };
            reader.readAsDataURL(file);
        }

        function renderPlayerName(el, player) {
            const customNames = JSON.parse(localStorage.getItem(CUSTOM_NAMES_KEY) || '{}');
            if (customNames[player.name]) {
                el.textContent = customNames[player.name];
                return;
            }
            const num = player.number || '';
            const lastName = player.name.split(' ').pop();
            const tryFit = (hash, cls) => {
                el.className = 'info-bar ' + cls;
                el.textContent = num ? (hash ? `#${num} ${lastName}` : `${num} ${lastName}`) : lastName;
                return el.scrollWidth <= el.clientWidth;
            };
            if (tryFit(true, '')) return;
            if (tryFit(false, '')) return;
            if (tryFit(false, 'font-small')) return;
            tryFit(false, 'font-tiny');
        }

        function createPlayerCard(player) {
            const card = document.createElement('div');
            card.className = 'player';
            card.draggable = true;
            const imgCont = document.createElement('div');
            imgCont.className = 'img-container';
            const customImgs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const url = customImgs[player.name] || player.headshot_url;
            
            if (url) {
                const img = document.createElement('img'); img.src = url; img.className = 'headshot';
                imgCont.appendChild(img);
            } else {
                imgCont.innerHTML = '<div class="placeholder">?</div>';
            }

            const badges = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
            if (badges[player.name]) {
                const b = document.createElement('div');
                b.className = 'badge'; b.textContent = badges[player.name];
                b.dataset.type = badges[player.name] === '★' ? 'star' : (badges[player.name] === 'C' ? 'captain' : 'alternate');
                imgCont.appendChild(b);
            }

            addBadgeSelector(imgCont, player.name);

            imgCont.onclick = () => {
                const f = document.createElement('input'); f.type = 'file';
                f.onchange = e => handleImageUpload(e.target.files[0], player.name);
                f.click();
            };
            imgCont.ondragover = e => e.preventDefault();
            imgCont.ondrop = e => { e.preventDefault(); if(e.dataTransfer.files[0]) handleImageUpload(e.dataTransfer.files[0], player.name); };

            card.appendChild(imgCont);
            const info = document.createElement('div');
            info.className = 'info-bar'; info.contentEditable = 'true'; info.spellcheck = false;
            renderPlayerName(info, player);
            setTimeout(() => renderPlayerName(info, player), 50);
            info.onblur = () => {
                const n = JSON.parse(localStorage.getItem(CUSTOM_NAMES_KEY) || '{}');
                n[player.name] = info.textContent;
                localStorage.setItem(CUSTOM_NAMES_KEY, JSON.stringify(n));
            };

            card.ondragstart = e => { if(!e.dataTransfer.files.length) draggedElement = card; };
            card.ondragover = e => e.preventDefault();
            card.ondrop = e => {
                if (e.dataTransfer.files.length || !draggedElement || draggedElement === card) return;
                const p = card.parentElement;
                const temp = document.createElement('div');
                p.insertBefore(temp, draggedElement);
                p.insertBefore(draggedElement, card);
                p.insertBefore(card, temp);
                p.removeChild(temp);
            };
            card.appendChild(info);
            return card;
        }

        function addBadgeSelector(container, playerName, isGoalie = false) {
            const selector = document.createElement('div');
            selector.className = 'badge-selector';
            const sel = document.createElement('select');
            let options = '<option value="none">None</option><option value="C">C</option><option value="A">A</option><option value="★">★</option>';
            if (isGoalie) options += '<option value="Starter">Starter</option>';
            sel.innerHTML = options;
            
            const badges = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
            sel.value = badges[playerName] || 'none';
            
            sel.onclick = e => e.stopPropagation();
            sel.onchange = () => {
                const b = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
                if(sel.value === 'none') delete b[playerName]; else b[playerName] = sel.value;
                localStorage.setItem(BADGE_STORAGE_KEY, JSON.stringify(b));
                location.reload();
            };
            selector.appendChild(sel);
            container.appendChild(selector);
        }

        function createStaffMember(type, index) {
            const staffData = JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY) || '{}');
            const key = `staff_${type}_${index}`;
            const saved = staffData[key] || {};
            const pre = type === 'Goalie' ? (lineupData.goalies[index-1] || {}) : (lineupData.coaches[index-1] || {});
            
            const member = document.createElement('div');
            member.className = 'staff-member';
            
            const badges = JSON.parse(localStorage.getItem(BADGE_STORAGE_KEY) || '{}');
            let isStarter = type === 'Goalie' && badges[pre.name] === 'Starter';
            if (isStarter) member.classList.add('starter-active');

            if (type === 'Coach' && index === 4 && localStorage.getItem('show_4th') !== 'true') member.classList.add('hidden-coach');

            const imgCont = document.createElement('div');
            imgCont.className = 'img-container';
            
            const role = document.createElement('div');
            role.className = 'staff-role-label'; role.contentEditable = "true";
            role.textContent = isStarter ? '*STARTING GOALIE*' : (saved.role || pre.role || type.toUpperCase());
            
            // Interaction Fix: Prevent Click bubbling to uploader
            role.onclick = e => e.stopPropagation();
            
            role.onblur = () => {
                const d = JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY) || '{}');
                d[key] = d[key] || {}; d[key].role = role.textContent;
                localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(d));
            };
            imgCont.appendChild(role);

            const url = saved.image || pre.headshot_url || pre.image;
            if (url) {
                const img = document.createElement('img'); img.src = url; img.className = 'headshot'; img.style.transform = 'none';
                imgCont.appendChild(img);
            } else {
                imgCont.innerHTML += '<div class="placeholder">?</div>';
            }

            if (type === 'Goalie') addBadgeSelector(imgCont, pre.name, true);

            imgCont.onclick = (e) => {
                const f = document.createElement('input'); f.type = 'file';
                f.onchange = ev => handleImageUpload(ev.target.files[0], null, true, key);
                f.click();
            };
            
            // Drag and Drop for Staff
            imgCont.ondragover = e => e.preventDefault();
            imgCont.ondrop = e => { 
                e.preventDefault(); 
                if(e.dataTransfer.files[0]) handleImageUpload(e.dataTransfer.files[0], null, true, key); 
            };

            member.appendChild(imgCont);
            const name = document.createElement('input');
            name.className = 'info-bar'; name.value = saved.name || (pre.name || "");
            name.placeholder = type === 'Coach' ? "COACH" : "NAME";
            name.oninput = () => {
                const d = JSON.parse(localStorage.getItem(STAFF_STORAGE_KEY) || '{}');
                d[key] = d[key] || {}; d[key].name = name.value;
                localStorage.setItem(STAFF_STORAGE_KEY, JSON.stringify(d));
            };
            member.appendChild(name);
            return member;
        }

        function initDraggable() {
            const controls = document.getElementById('draggable-controls');
            let isDragging = false; let off = { x: 0, y: 0 };
            controls.onmousedown = (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;
                isDragging = true;
                off.x = e.clientX - controls.offsetLeft; off.y = e.clientY - controls.offsetTop;
            };
            document.onmousemove = (e) => {
                if (!isDragging) return;
                controls.style.left = (e.clientX - off.x) + 'px';
                controls.style.top = (e.clientY - off.y) + 'px';
                controls.style.right = 'auto';
            };
            document.onmouseup = () => isDragging = false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const fGrid = document.getElementById('forwards-grid');
            const dGrid = document.getElementById('defensemen-grid');
            const goalieCont = document.getElementById('goalie-container');
            const coachRow = document.getElementById('coach-row');
            
            (lineupData.forwards || []).forEach(p => fGrid.appendChild(createPlayerCard(p)));
            (lineupData.defensemen || []).forEach(p => dGrid.appendChild(createPlayerCard(p)));
            
            goalieCont.appendChild(createStaffMember('Goalie', 1));
            goalieCont.appendChild(createStaffMember('Goalie', 2));
            const notes = document.createElement('div');
            notes.className = 'notes-area';
            notes.innerHTML = `<textarea id="notes-input" placeholder="NOTES..."></textarea>`;
            goalieCont.parentElement.appendChild(notes);
            const nInp = document.getElementById('notes-input');
            nInp.value = localStorage.getItem('notes') || "";
            nInp.oninput = () => localStorage.setItem('notes', nInp.value);

            cRow.appendChild(createStaffMember('Coach', 1));
            cRow.appendChild(createStaffMember('Coach', 2));
            cRow.appendChild(createStaffMember('Coach', 3));
            cRow.appendChild(createStaffMember('Coach', 4));

            initDraggable();
        });
    </script>
</body>
</html>
