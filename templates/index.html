<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Lineup Generator</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent-color: #007bff;
            --highlight-color: #28a745;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-clear { background-color: #dc3545; color: white; }
        .btn-generate { background-color: var(--accent-color); color: white; }
        button:hover { opacity: 0.8; }

        .lineup-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
        }

        /* The Player/Goalie/Coach Boxes */
        .slot-box {
            width: 150px;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Visual cue for Drag and Drop */
        .slot-box.drag-over {
            border: 2px dashed var(--highlight-color);
            background: rgba(40, 167, 69, 0.1);
            transform: scale(1.05);
        }

        .slot-box img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #444;
            margin-bottom: 10px;
        }

        .slot-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #aaa;
            margin-top: 5px;
        }

        .file-input-label {
            display: block;
            font-size: 0.7rem;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <h1>NHL Lineup Generator</h1>

    <div class="controls">
        <button class="btn-generate" onclick="window.location.reload()">Refresh Lineup</button>
        <button class="btn-clear" onclick="clearAllCustomImages()">Clear Custom Images</button>
    </div>

    <div class="lineup-grid">
        {% for i in range(20) %}
        <div class="slot-box" data-slot-id="{{ i }}">
            <img src="https://via.placeholder.com/150x150?text=Drop+Image" alt="Player" class="player-img">
            <div class="slot-label">Slot {{ i + 1 }}</div>
            <label class="file-input-label">
                Search Files
                <input type="file" accept="image/*" onchange="handleFileSelect(this)">
            </label>
        </div>
        {% endfor %}
    </div>

    <script>
        // Default Placeholder Image
        const PLACEHOLDER = "https://via.placeholder.com/150x150?text=Drop+Image";

        // Initialize Drag and Drop listeners
        const boxes = document.querySelectorAll('.slot-box');

        boxes.forEach(box => {
            // Highlight box when dragging file over it
            ['dragenter', 'dragover'].forEach(eventName => {
                box.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    box.classList.add('drag-over');
                }, false);
            });

            // Remove highlight when dragging away
            ['dragleave', 'drop'].forEach(eventName => {
                box.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    box.classList.remove('drag-over');
                }, false);
            });

            // Handle the dropped file
            box.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const file = dt.files[0];
                if (file) {
                    const imgElement = box.querySelector('.player-img');
                    previewImage(file, imgElement);
                }
            });
        });

        // Handle standard "Search Files" input
        function handleFileSelect(input) {
            const file = input.files[0];
            const imgElement = input.closest('.slot-box').querySelector('.player-img');
            if (file) {
                previewImage(file, imgElement);
            }
        }

        // Generic function to read image and update source
        function previewImage(file, imgTag) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imgTag.src = e.target.result;
                    imgTag.classList.add('is-custom'); // Mark as custom
                };
                reader.readAsDataURL(file);
            }
        }

        // The CLEAR function
        function clearAllCustomImages() {
            const allImages = document.querySelectorAll('.player-img');
            allImages.forEach(img => {
                img.src = PLACEHOLDER;
                img.classList.remove('is-custom');
            });
            // Also reset all file inputs
            document.querySelectorAll('input[type="file"]').forEach(input => input.value = "");
        }
    </script>
</body>
</html>
