<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Activity</title>
    <style>
        :root {
            --bg: #f4f5f7; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
            --nhl: #1d4ed8; --mlb: #b91c1c; --print: #047857; --photo: #7c3aed; --bad: #dc2626;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
        header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        h1 { font-size: 22px; margin: 0; flex: 1; }
        h2 { font-size: 15px; margin: 28px 0 10px; }
        .muted { color: var(--muted); }
        select, input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
        .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
        .tile .n { font-size: 26px; font-weight: 700; }
        .tile .l { color: var(--muted); font-size: 12px; }
        .chart { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 10px; }
        .bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
        .bar { flex: 1; display: flex; flex-direction: column-reverse; min-width: 4px; }
        .bar span { display: block; }
        .bar .nhl { background: var(--nhl); } .bar .mlb { background: var(--mlb); }
        .bar:hover { opacity: .75; }
        .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 6px; }
        .legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }
        .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 22px 0 10px; }
        .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
        .chip.on { background: var(--text); color: #fff; border-color: var(--text); }
        .filters input { margin-left: auto; min-width: 220px; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafafa; }
        tr.day td { background: #f9fafb; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
        tr.fail td { background: #fef2f2; }
        .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; color: #fff; white-space: nowrap; }
        .tag.nhl { background: var(--nhl); } .tag.mlb { background: var(--mlb); } .tag.print { background: var(--print); } .tag.photo { background: var(--photo); }
        .what b { display: block; }
        .who .name { font-weight: 600; }
        .who .name.unnamed { color: var(--muted); font-weight: 400; font-style: italic; }
        .linkish { color: var(--nhl); cursor: pointer; font-size: 12px; margin-left: 6px; }
        .ok { color: var(--print); font-weight: 700; } .bad { color: var(--bad); font-weight: 700; }
        .small { font-size: 12px; color: var(--muted); }
        .empty { padding: 30px; text-align: center; color: var(--muted); }
        @media (max-width: 760px) {
            .hide-sm { display: none; }
            .filters input { margin-left: 0; min-width: 0; width: 100%; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Site Activity</h1>
        <span class="small" id="updated"></span>
        <select id="range">
            <option value="1">Today</option>
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last year</option>
        </select>
    </header>

    <div class="tiles" id="tiles"></div>
    <div class="chart">
        <div class="bars" id="bars"></div>
        <div class="axis"><span id="axis-start"></span><span id="axis-end"></span></div>
        <div class="legend">Sheets made per day <i style="background:var(--nhl)"></i>NHL <i style="background:var(--mlb)"></i>MLB</div>
    </div>

    <h2>People</h2>
    <table id="people"></table>

    <div class="filters" id="filters">
        <button class="chip on" data-f="all">Everything</button>
        <button class="chip" data-f="nhl">NHL lineups</button>
        <button class="chip" data-f="mlb">MLB sheets</button>
        <button class="chip" data-f="print">Prints</button>
        <button class="chip" data-f="photo">Coach photos</button>
        <button class="chip" data-f="fail">Failures</button>
        <input type="search" id="search" placeholder="Search team, person, place…">
    </div>
    <table id="events"></table>
</div>

<script>
    const NHL_TEAMS = {ANA:'Ducks',BOS:'Bruins',BUF:'Sabres',CAR:'Hurricanes',CBJ:'Blue Jackets',CGY:'Flames',CHI:'Blackhawks',COL:'Avalanche',DAL:'Stars',DET:'Red Wings',EDM:'Oilers',FLA:'Panthers',LAK:'Kings',MIN:'Wild',MTL:'Canadiens',NJD:'Devils',NSH:'Predators',NYI:'Islanders',NYR:'Rangers',OTT:'Senators',PHI:'Flyers',PIT:'Penguins',SEA:'Kraken',SJS:'Sharks',STL:'Blues',TBL:'Lightning',TOR:'Maple Leafs',UTA:'Mammoth',VAN:'Canucks',VGK:'Golden Knights',WPG:'Jets',WSH:'Capitals'};
    const KINDS = {
        nhl_screenshot: { tag: 'NHL', cls: 'nhl', group: 'nhl', label: 'Lineup · screenshot' },
        nhl_numbers:    { tag: 'NHL', cls: 'nhl', group: 'nhl', label: 'Lineup · jersey numbers' },
        mlb:            { tag: 'MLB', cls: 'mlb', group: 'mlb', label: 'Headshot sheet' },
        print_nhl:      { tag: 'PRINT', cls: 'print', group: 'print', label: 'Printed NHL sheet' },
        print_mlb:      { tag: 'PRINT', cls: 'print', group: 'print', label: 'Printed MLB sheet' },
        coach_photo:    { tag: 'PHOTO', cls: 'photo', group: 'photo', label: 'Coach photo uploaded' },
    };
    let rows = [], filter = 'all';
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const teamName = s => NHL_TEAMS[s] ? `${NHL_TEAMS[s]} (${s})` : s;
    const dayKey = ts => new Date(ts * 1000).toDateString();
    const timeStr = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    function dayLabel(ts) {
        const d = new Date(ts * 1000), today = new Date(); const y = new Date(); y.setDate(today.getDate() - 1);
        if (d.toDateString() === today.toDateString()) return 'Today';
        if (d.toDateString() === y.toDateString()) return 'Yesterday';
        return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function ago(ts) {
        const s = Date.now() / 1000 - ts;
        if (s < 60) return 'just now';
        if (s < 3600) return `${Math.floor(s / 60)}m ago`;
        if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
        return `${Math.floor(s / 86400)}d ago`;
    }
    const isSheet = r => ['nhl', 'mlb'].includes((KINDS[r.kind] || {}).group);

    async function load() {
        const res = await fetch(`${location.origin}/activity/data?days=${$('range').value}`);
        rows = await res.json();
        $('updated').textContent = `Updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} · refreshes every minute`;
        render();
    }

    function whoCell(r) {
        const name = r.name ? `<span class="name">${esc(r.name)}</span>` : `<span class="name unnamed">Unnamed</span>`;
        const where = [r.place, r.network].filter(Boolean).map(esc).join(' · ');
        return `${name}<span class="linkish" data-name="${esc(r.visitor)}">${r.name ? 'rename' : 'name them'}</span>
            <div class="small">${esc(r.browser)}${where ? ' · ' + where : ''}</div>
            <div class="small hide-sm">IP ${esc(r.ip)}</div>`;
    }

    function render() {
        const sheets = rows.filter(isSheet);
        const people = new Set(rows.map(r => r.visitor));
        const tiles = [
            [rows.filter(r => KINDS[r.kind]?.group === 'nhl' && r.ok).length, 'NHL lineups made'],
            [rows.filter(r => r.kind === 'mlb' && r.ok).length, 'MLB sheets made'],
            [rows.filter(r => KINDS[r.kind]?.group === 'print').length, 'Sheets printed'],
            [people.size, 'People'],
            [rows.filter(r => !r.ok).length, 'Failures'],
        ];
        $('tiles').innerHTML = tiles.map(([n, l]) => `<div class="tile"><div class="n" style="${l === 'Failures' && n ? 'color:var(--bad)' : ''}">${n}</div><div class="l">${l}</div></div>`).join('');

        // Daily bars
        const days = +$('range').value, counts = [];
        for (let i = days - 1; i >= 0; i--) {
            const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
            counts.push({ d, nhl: 0, mlb: 0 });
        }
        sheets.forEach(r => {
            const c = counts.find(c => c.d.toDateString() === dayKey(r.ts));
            if (c) c[KINDS[r.kind].group]++;
        });
        const max = Math.max(1, ...counts.map(c => c.nhl + c.mlb));
        $('bars').innerHTML = counts.map(c => `<div class="bar" title="${c.d.toLocaleDateString([], {month:'short',day:'numeric'})}: ${c.nhl} NHL, ${c.mlb} MLB" style="height:100%">
            <span class="nhl" style="height:${c.nhl / max * 100}%"></span><span class="mlb" style="height:${c.mlb / max * 100}%"></span></div>`).join('');
        $('axis-start').textContent = counts[0].d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        $('axis-end').textContent = 'Today';

        // People
        const byVisitor = {};
        rows.forEach(r => {
            const p = byVisitor[r.visitor] ||= { r, sheets: 0, prints: 0, last: 0, teams: {} };
            if (isSheet(r) && r.ok) { p.sheets++; p.teams[r.summary] = (p.teams[r.summary] || 0) + 1; }
            if (KINDS[r.kind]?.group === 'print') p.prints++;
            if (r.ts > p.last) { p.last = r.ts; p.r = r; }
        });
        const plist = Object.values(byVisitor).sort((a, b) => b.last - a.last);
        $('people').innerHTML = `<tr><th>Who</th><th>Sheets</th><th class="hide-sm">Prints</th><th class="hide-sm">Most used</th><th>Last seen</th></tr>` +
            (plist.length ? plist.map(p => {
                const top = Object.entries(p.teams).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([t, n]) => `${esc(teamName(t))} ×${n}`).join(', ');
                return `<tr><td class="who">${whoCell(p.r)}</td><td>${p.sheets}</td><td class="hide-sm">${p.prints}</td><td class="hide-sm small">${top || '—'}</td><td>${ago(p.last)}</td></tr>`;
            }).join('') : `<tr><td colspan="5" class="empty">No visitors in this period.</td></tr>`);

        // Events
        const q = $('search').value.trim().toLowerCase();
        const shown = rows.filter(r => {
            const k = KINDS[r.kind] || {};
            if (filter === 'fail' ? r.ok : (filter !== 'all' && k.group !== filter)) return false;
            if (!q) return true;
            return [r.summary, teamName(r.summary), r.detail, r.name, r.browser, r.place, r.network, r.ip, k.label].join(' ').toLowerCase().includes(q);
        });
        let html = `<tr><th>Time</th><th>What</th><th>Who</th><th>Result</th><th class="hide-sm">Took</th></tr>`, lastDay = '';
        shown.forEach(r => {
            const k = KINDS[r.kind] || { tag: r.kind, cls: '', label: '' };
            if (dayKey(r.ts) !== lastDay) { lastDay = dayKey(r.ts); html += `<tr class="day"><td colspan="5">${dayLabel(r.ts)}</td></tr>`; }
            html += `<tr class="${r.ok ? '' : 'fail'}">
                <td style="white-space:nowrap">${timeStr(r.ts)}<div class="small">${ago(r.ts)}</div></td>
                <td class="what"><span class="tag ${k.cls}">${k.tag}</span> <b>${esc(teamName(r.summary))}</b><span class="small">${esc(k.label)}${r.ok && r.detail ? ' · ' + esc(r.detail) : ''}</span></td>
                <td class="who">${whoCell(r)}</td>
                <td>${r.ok ? '<span class="ok">✓ Worked</span>' : `<span class="bad">✗ Failed</span><div class="small">${esc(r.detail)}</div>`}</td>
                <td class="hide-sm small">${r.secs != null ? r.secs.toFixed(1) + 's' : ''}</td></tr>`;
        });
        if (!shown.length) html += `<tr><td colspan="5" class="empty">Nothing here for this period.</td></tr>`;
        $('events').innerHTML = html;
    }

    document.addEventListener('click', async e => {
        const n = e.target.closest('[data-name]');
        if (n) {
            const visitor = n.dataset.name;
            const current = (rows.find(r => r.visitor === visitor) || {}).name || '';
            const name = prompt('Name for this person/browser (leave empty to clear):', current);
            if (name === null) return;
            const f = new FormData(); f.append('visitor', visitor); f.append('name', name);
            await fetch(`${location.origin}/activity/name`, { method: 'POST', body: f });
            load();
        }
        const chip = e.target.closest('.chip');
        if (chip) {
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
            filter = chip.dataset.f; render();
        }
    });
    $('search').addEventListener('input', render);
    $('range').addEventListener('change', load);
    load();
    setInterval(load, 60000);
</script>
</body>
</html>
